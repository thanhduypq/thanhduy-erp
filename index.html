<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thành Duy ERP</title>
  <meta name="theme-color" content="#0a7c66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thành Duy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    :root { --g1:#08684d; --g2:#19b07c; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:#08684d; font-family:-apple-system, 'Segoe UI', Roboto, sans-serif; }
    #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:#eef8f3;
           padding-top:env(safe-area-inset-top); }
    #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
              background:linear-gradient(135deg, var(--g1), var(--g2)); color:#fff; z-index:5; transition:opacity .35s; }
    #splash img { width:96px; height:96px; border-radius:22px; box-shadow:0 12px 30px rgba(0,0,0,.25); }
    #splash h1 { margin:0; font-size:24px; }
    #splash p { margin:0; opacity:.85; }
    .bar { width:160px; height:6px; border-radius:9px; background:rgba(255,255,255,.25); overflow:hidden; }
    .bar i { display:block; width:40%; height:100%; background:#fff; border-radius:9px; animation:run 1.2s ease-in-out infinite; }
    @keyframes run { 0%{transform:translateX(-100%)} 100%{transform:translateX(260%)} }
    #msg { position:fixed; left:12px; right:12px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:6; display:none;
           background:#fff; color:#12363a; border-radius:16px; padding:14px 16px; box-shadow:0 10px 30px rgba(0,0,0,.25); font-size:14px; line-height:1.5; }
    #msg b { color:#0a7c66; }
    #msg button { margin-top:10px; border:0; border-radius:12px; padding:10px 14px; font-weight:700; background:#0a7c66; color:#fff; }
    #msg .ghost { background:#e2f4ee; color:#0a7c66; margin-left:6px; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icon-192.png" alt="">
    <h1>Thành Duy ERP</h1>
    <p>Đang mở phần mềm...</p>
    <div class="bar"><i></i></div>
  </div>
  <iframe id="app" title="Thành Duy ERP" allow="clipboard-write; clipboard-read; camera; geolocation" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div id="msg"></div>

  <script>
    /* ==== CẤU HÌNH: dán link web app Apps Script (kết thúc bằng /exec) vào giữa 2 dấu nháy ==== */
    var APP_URL = 'https://script.google.com/macros/s/AKfycbzK4jdGovWpsWEFX2fJDrNi-x1jHO4Qj3etFdds3YECT5iQxgSmX2Bo_A3mMFvrVMS5/exec';
    /* ==== THÔNG BÁO ĐIỆN THOẠI: dán OneSignal App ID vào đây (để trống = tắt thông báo đẩy) ==== */
    var ONESIGNAL_APP_ID = '';
    /* ======================================================================================== */

    var frame = document.getElementById('app'), splash = document.getElementById('splash'), msg = document.getElementById('msg');
    function showMsg(html) { msg.innerHTML = html; msg.style.display = 'block'; }
    function hideMsg() { msg.style.display = 'none'; }

    // Cho phép đổi link mà không sửa file: mở 1 lần với ?url=<link /exec>
    try {
      var q = new URLSearchParams(location.search).get('url');
      if (q && /^https:\/\/script\.google\.com\/.+\/exec/.test(q)) localStorage.setItem('TD_APP_URL', q);
      var saved = localStorage.getItem('TD_APP_URL');
      if (saved && APP_URL.indexOf('DAN_LINK') === 0) APP_URL = saved;
    } catch (e) {}

    function load() {
      if (!/^https:\/\/script\.google\.com\//.test(APP_URL)) {
        splash.style.display = 'none';
        showMsg('<b>Chưa cấu hình link phần mềm.</b><br>Quản lý mở tệp <code>index.html</code> và dán link web app (kết thúc bằng <code>/exec</code>) vào dòng <code>APP_URL</code>.');
        return;
      }
      if (!navigator.onLine) {
        showMsg('<b>Không có kết nối mạng.</b><br>Phần mềm cần Internet để tải dữ liệu.<br><button onclick="location.reload()">Thử lại</button>');
      }
      frame.src = appUrlWithLink();
    }
    // Mở từ thông báo: ...github.io/xxx/?ch=bk:123 -> mở thẳng hội thoại đó
    function appUrlWithLink() {
      try {
        var ch = new URLSearchParams(location.search).get('ch');
        if (ch && /^(g|dm|bk):[\w:|.\-]+$/.test(ch)) return APP_URL + (APP_URL.indexOf('?') > -1 ? '&' : '?') + 'ch=' + encodeURIComponent(ch);
      } catch (e) {}
      return APP_URL;
    }
    frame.addEventListener('load', function() {
      if (!frame.src) return;
      setTimeout(function() { splash.style.opacity = '0'; setTimeout(function() { splash.style.display = 'none'; }, 400); }, 600);
    });
    // Phần mềm yêu cầu tải lại (đăng xuất) -> nạp lại khung
    window.addEventListener('message', function(e) {
      if (!e || !e.data || !/(^https:\/\/script\.google\.com$)|(\.googleusercontent\.com$)/.test(e.origin || '')) return;
      if (e.data.type === 'td-erp-reload') {
        splash.style.display = 'flex'; splash.style.opacity = '1'; frame.src = APP_URL;
        pushLogout();
      }
      if (e.data.type === 'td-erp-user' && e.data.maNV) pushLogin(String(e.data.maNV).toUpperCase());
      if (e.data.type === 'td-erp-badge') {
        try { if (navigator.setAppBadge) { if (e.data.count > 0) navigator.setAppBadge(e.data.count); else navigator.clearAppBadge(); } } catch (x) {}
      }
    });

    /* ---- Thông báo đẩy (OneSignal) ---- */
    var pushUser = '';
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    if (ONESIGNAL_APP_ID) {
      var base = location.pathname.replace(/[^\/]*$/, '');             // vd: /thanhduy-erp/
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: ONESIGNAL_APP_ID,
          serviceWorkerPath: base.replace(/^\//, '') + 'push/onesignal/OneSignalSDKWorker.js',
          serviceWorkerParam: { scope: base + 'push/onesignal/' },
          notifyButton: { enable: false }
        });
      });
    }
    function pushLogin(code) {
      if (!ONESIGNAL_APP_ID || !code) return;
      pushUser = code;
      OneSignalDeferred.push(async function(OneSignal) {
        try { await OneSignal.login(code); } catch (x) {}
        if (!OneSignal.Notifications.isPushSupported()) {
          if (isIOS && !standalone) setTimeout(function() {
            showMsg('<b>Muốn nhận thông báo tin nhắn / lịch mới trên iPhone?</b><br>Cần cài app lên màn hình chính trước: bấm <b>Chia sẻ</b> → <b>“Thêm vào MH chính”</b>, rồi mở app từ biểu tượng.<br>' +
                    '<button onclick="hideMsg()">Đã hiểu</button>');
          }, 3000);
          return;
        }
        var later = 0; try { later = +localStorage.getItem('TD_PUSH_LATER') || 0; } catch (x) {}
        if (!OneSignal.Notifications.permission && Date.now() - later > 3 * 86400000) {
          setTimeout(function() {
            showMsg('<b>🔔 Bật thông báo?</b><br>Nhận tin nhắn, lịch mới, tài xế báo kết thúc tour… ngay cả khi đang tắt app.<br>' +
                    '<button id="pushOn">Bật thông báo</button><button class="ghost" id="pushLater">Để sau</button>');
            document.getElementById('pushOn').onclick = function() { hideMsg(); OneSignal.Notifications.requestPermission(); };
            document.getElementById('pushLater').onclick = function() { hideMsg(); try { localStorage.setItem('TD_PUSH_LATER', String(Date.now())); } catch (x) {} };
          }, 2500);
        }
      });
    }
    function pushLogout() {
      if (!ONESIGNAL_APP_ID || !pushUser) return;
      pushUser = '';
      OneSignalDeferred.push(async function(OneSignal) { try { await OneSignal.logout(); } catch (x) {} });
    }
    window.addEventListener('online', function() { hideMsg(); });
    window.addEventListener('offline', function() { showMsg('<b>Mất kết nối mạng.</b> Dữ liệu sẽ cập nhật lại khi có mạng.'); });

    // Gợi ý cài đặt
    var deferred = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault(); deferred = e;
      showMsg('<b>Cài Thành Duy ERP lên điện thoại?</b><br>Có biểu tượng trên màn hình chính, mở nhanh như app.<br>' +
              '<button id="ins">Cài đặt</button><button class="ghost" onclick="hideMsg()">Để sau</button>');
      document.getElementById('ins').onclick = function() { deferred.prompt(); deferred.userChoice.then(hideMsg); };
    });
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    try {
      if (isIOS && !standalone && !localStorage.getItem('TD_IOS_HINT')) {
        setTimeout(function() {
          showMsg('<b>Cài lên iPhone:</b> bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên) ở thanh dưới Safari → chọn <b>“Thêm vào MH chính”</b> → <b>Thêm</b>.<br>' +
                  '<button onclick="hideMsg();localStorage.setItem(\'TD_IOS_HINT\',\'1\')">Đã hiểu</button>');
        }, 2500);
      }
    } catch (e) {}

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function() {});
    load();
  </script>
</body>
</html>
